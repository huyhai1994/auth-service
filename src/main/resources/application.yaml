spring:
  application:
    name: auth-service
  flyway:
    enabled: true
    locations: classpath:db/migration
logging:
  level:
    org.flywaydb: info
management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

      percentiles:
        http.server.requests: 0.5,0.9,0.95,0.99
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
          - metrics
  endpoint:
    health:
      show-details: always
