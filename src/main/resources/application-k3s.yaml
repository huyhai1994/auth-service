server:
  port: ${SERVER_PORT:20000}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:auth-service-k3s}
  datasource:
    url: ${MYSQL_JDBC}
    username: ${USER_NAME}
    password: ${PASS_WORD}
    hikari:
      maximum-pool-size: ${HIKARI_MAXIMUM_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MINIMUM_IDLE:1}
      idle-timeout: ${HIKARI_IDLE_TIMEOUT:300000}
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:30000}
      max-lifetime: ${HIKARI_MAX_LIFETIME:300000}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    show-sql: ${JPA_SHOW_SQL:false}
  data:
    redis:
      host: ${REDIS_ENDPOINT}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: 0
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  kafka:
    bootstrap-servers:
      - ${KAFKA_ENDPOINT}

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: ${KAFKA_PRODUCER_ACKS:all}

      properties:
        enable.idempotence: ${KAFKA_ENABLE_IDEMPOTENCE:true}
        max.in.flight.requests.per.connection: ${KAFKA_MAX_IN_FLIGHT:5}
        delivery.timeout.ms: ${KAFKA_DELIVERY_TIMEOUT_MS:30000}
        request.timeout.ms: ${KAFKA_REQUEST_TIMEOUT_MS:10000}
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:30000}

    admin:
      fail-fast: ${KAFKA_ADMIN_FAIL_FAST:true}
      auto-create: ${KAFKA_ADMIN_AUTO_CREATE:false}
      operation-timeout: ${KAFKA_ADMIN_OPERATION_TIMEOUT:5s}

    client-id: ${KAFKA_CLIENT_ID:auth-service}

logging:
  level:
    org:
      hibernate:
        SQL: ${LOG_HIBERNATE_SQL:DEBUG}
        type:
          descriptor:
            sql:
              BasicBinder: ${LOG_HIBERNATE_BINDER:TRACE}
        orm:
          results: ${LOG_HIBERNATE_RESULTS:TRACE}

      springframework:
        security: ${LOG_SPRING_SECURITY:TRACE}

      apache:
        kafka:
          clients:
            producer:
              ProducerConfig: ${LOG_KAFKA_PRODUCER_CONFIG:DEBUG}

user-register:
  topic: ${USER_REGISTER_TOPIC:test.notifications.register-events.v1}

security:
  jwt:
    secret-key: ${JWT_SECRET_KEY}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:15m}
    issuer: ${JWT_ISSUER:auth-service}

  identity-hash:
    secret-key: ${IDENTITY_HASH_SECRET_KEY}

  login-rate-limit:
    username-ip-max-attempts: ${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:10}
    window-duration: ${LOGIN_RATE_LIMIT_WINDOW_DURATION:1m}

  login-attempt:
    failure-attempts: ${LOGIN_FAILURE_ATTEMPTS:5}
    lock-duration: ${LOGIN_LOCK_DURATION:60m}